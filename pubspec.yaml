name: finance_tracker
description: Personal offline finance tracker for Android.
publish_to: none
version: 1.13.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  intl: ^0.20.0
  # archive v3 API (ArchiveFile(name, size, content), ZipEncoder().encode
  # returning List<int>?). v4 changed these; do not bump without porting.
  archive: ^3.6.1
  # share_plus v11 API: SharePlus.instance.share(ShareParams(...)).
  share_plus: ^11.0.0
  # file_picker v10 API: FilePicker.platform.pickFiles(...).
  file_picker: ^10.1.0
  # On-device receipt text reading (Latin script only).
  google_mlkit_text_recognition: ">=0.15.0 <2.0.0"
  # Fingerprint / face unlock. v3 API: authenticate(localizedReason:,
  # biometricOnly:, persistAcrossBackgrounding:).
  local_auth: ">=3.0.0 <4.0.0"
  # SHA-256 for the app lock PIN.
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android scaffold
        run: |
          rm -rf /tmp/scaffold ./android
          flutter create --platforms=android --org ph.patrick --project-name finance_tracker /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Set launcher label
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i -E 's/android:label="[^"]*"/android:label="Finance Tracker"/' "$MANIFEST"
          grep -q 'android:label="Finance Tracker"' "$MANIFEST"

      - name: Android setup (scan, app lock, widget, reminders)
        run: |
          set -e
          ACT=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          test -n "$ACT"
          DIR=$(dirname "$ACT")
          PKG=$(grep -m1 '^package ' "$ACT")
          for f in ci/android/*.kt; do
            { echo "$PKG"; tail -n +2 "$f"; } > "$DIR/$(basename "$f")"
          done
          ls "$DIR"
          cp -r ci/android/res/. android/app/src/main/res/
          cp ci/android/proguard-rules.pro android/app/proguard-rules.pro
          GRADLE=android/app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("debug")' "$GRADLE"
          sed -i 's|signingConfig = signingConfigs.getByName("debug")|signingConfig = signingConfigs.getByName("debug")\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")|' "$GRADLE"
          grep -n 'proguard' "$GRADLE"
          python3 - <<'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          xml = open(path).read()
          perms = "".join(
              f'    <uses-permission android:name="android.permission.{p}"/>\n'
              for p in ("USE_BIOMETRIC", "POST_NOTIFICATIONS", "RECEIVE_BOOT_COMPLETED", "CAMERA")
          )
          assert "<application" in xml
          xml = xml.replace("<application", perms + "    <application", 1)
          extra = open("ci/android/manifest-additions.xml").read()
          i = xml.rindex("</application>")
          xml = xml[:i] + extra + "    " + xml[i:]
          open(path, "w").write(xml)
          EOF
          cat android/app/src/main/AndroidManifest.xml

      - name: Install fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "finance-tracker-${{ github.run_number }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-${{ github.run_number }}
          path: finance-tracker-${{ github.run_number }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          APK="finance-tracker-${{ github.run_number }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Finance Tracker build ${{ github.run_number }}" \
              --notes "Automatic build from commit $GITHUB_SHA. Download the APK below and open it on your phone."
          fi
